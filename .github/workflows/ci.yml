name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Each job asks for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The platform's pipeline API for the stage this repository releases to. It is also the
  # audience the job's token is made out to, so a token for it is good nowhere else.
  FLEX_CI_API: https://development.flex-shared.once.service.gov.uk/ci
  # The domain the stage's config registers this repository for.
  FLEX_DOMAIN: example

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build the bundle
        run: pnpm run build

  release:
    name: Release to development
    needs: checks
    # Never for a pull request: only what is on main is released.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The job waits for the release to be live, which takes seconds, or minutes the first time.
    # The script stops waiting after 17 minutes and says how the release was, so this is never
    # what ends it.
    timeout-minutes: 20
    # The platform takes an upload or a release only from a job in the GitHub environment named
    # for its own. GitHub puts the name in the job's token once this environment's protection
    # rules pass.
    environment: development
    permissions:
      contents: read
      # To ask GitHub for the token the pipeline API verifies. The job holds no AWS credentials.
      id-token: write
    env:
      FLEX_ENVIRONMENT: development
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the bundle
        run: pnpm run build

      - name: Upload the bundle, release it and wait for it to be live
        run: pnpm run release
